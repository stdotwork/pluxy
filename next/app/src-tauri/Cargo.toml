[package]
name = "pluxy-app"
version = "0.1.0"
description = "The pluxy desktop app: a window, a tray icon and, if wanted, a core of its own"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "pluxy_app"
path = "src/lib.rs"

[[bin]]
name = "pluxy-app"
path = "src/main.rs"

[features]
# For the native test only (native/run.ts): the app probes its webviews' command access and
# reports on stderr. Never in a release build.
native-test = []
# Loads publisher roots only for tests that create an isolated temporary trust profile.
artifact-test-trust = []

[build-dependencies]
serde_json = "1"
json-patch = "4"
sha2 = { version = "=0.10.9", default-features = false }
tauri-utils = { version = "=2.10.2", default-features = false }
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "=2.2.0", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
url = "2"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The same GTK Tauri uses, to lay page webviews over the window (src/place.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
json-patch = "4"
tauri-utils = { version = "=2.10.2", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
