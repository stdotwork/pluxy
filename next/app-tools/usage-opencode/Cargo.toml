[package]
name = "usage-opencode"
version = "0.1.0"
description = "The OpenCode usage parser for pluxy's usage hub: OpenCode's database and JSON message files to token rows"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pluxy-program = { path = "../lib/program" }
pluxy-usage = { path = "../lib/usage" }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde_json = "1"
