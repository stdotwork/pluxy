[package]
name = "codex-setup"
version = "0.1.0"
description = "Sets up and starts Codex for pluxy's desktop app"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pluxy-program = { path = "../lib/program" }
pluxy-transactions = { path = "../lib/transactions", features = ["toml"] }
# Keys keep their order and numbers their digits in the catalog it rewrites.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
