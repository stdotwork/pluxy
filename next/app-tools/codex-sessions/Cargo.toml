[package]
name = "codex-sessions"
version = "0.1.0"
description = "Reads Codex's local sessions for pluxy's desktop app, read-only"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pluxy-files = { path = "../lib/files" }
pluxy-program = { path = "../lib/program" }
pluxy-sqlite-ro = { path = "../lib/sqlite-ro" }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde_json = "1"

[features]
# For the native test only (next/app/native/run.ts): `open` also sends the folder named by the file
# `opener-folder` in the tool's data folder as the search path of its prepare call, for the test's
# stand-in opener. Never in a release build.
native-test = []
