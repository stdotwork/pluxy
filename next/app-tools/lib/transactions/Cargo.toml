[package]
name = "pluxy-transactions"
version = "0.1.0"
description = "Link-preserving, journalled config writes for pluxy's app tools"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cap-std = "=4.0.3"
getrandom = "0.3"
pluxy-program = { path = "../program" }
# Keys keep their order and numbers their digits in the files the library rewrites.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "=0.10.9"

[[example]]
name = "fixture-writer"
path = "examples/fixture-writer/main.rs"
