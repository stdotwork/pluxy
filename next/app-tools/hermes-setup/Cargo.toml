[package]
name = "hermes-setup"
version = "0.1.0"
description = "Sets up and starts Hermes Agent for pluxy's desktop app"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pluxy-files = { path = "../lib/files" }
pluxy-program = { path = "../lib/program" }
pluxy-transactions = { path = "../lib/transactions", features = ["yaml"] }
# Keys keep their order in the values it compares and writes.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
