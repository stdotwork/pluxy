[package]
name = "pi-setup"
version = "0.1.0"
description = "Sets up and starts Pi, and manages its CLIProxyAPI provider plugin, for pluxy's desktop app"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pluxy-files = { path = "../lib/files" }
pluxy-program = { path = "../lib/program" }
pluxy-transactions = { path = "../lib/transactions" }
# Keys keep their order and numbers their digits in the settings files it rewrites.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }

[dev-dependencies]
# The tests act between the steps of a plugin folder's update or removal (the library's hook).
pluxy-transactions = { path = "../lib/transactions", features = ["test-hooks"] }
