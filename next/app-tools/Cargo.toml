[workspace]
resolver = "2"
members = ["lib/files", "lib/program", "lib/transactions", "lib/usage", "lib/sqlite-ro", "lib/pi-sessions", "agent-usage", "claude-code", "claude-desktop", "codex", "codex-sessions", "execution", "grok-setup", "hermes-setup", "omp-setup", "opencode", "pi-setup", "usage-claude", "usage-codex", "usage-fixture", "usage-omp", "usage-opencode", "usage-pi", "wsl"]

[workspace.package]
edition = "2021"
rust-version = "1.89"
publish = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
