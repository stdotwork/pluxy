name: Next release

# A tag next-vX.Y.Z packs the extensions for every platform, uploads the archives and
# registry.json to that tag's GitHub release, and pushes the container image to the GitHub
# container registry. A pull request that touches the image, this workflow or the pack tool
# builds the image and starts it, so a broken image fails before any tag.

on:
  push:
    tags:
      - 'next-v*'
  pull_request:
    paths:
      - 'next/Dockerfile'
      - 'next/.dockerignore'
      - 'next/compose.example.yaml'
      - 'next/cmd/pluxy-pack/**'
      - '.github/workflows/next-release.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The platforms the extension archives are packed for: the platforms of every extension's
  # manifest.
  PLATFORMS: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64

jobs:
  # Builds the image and starts it with a temporary config. This is what fails when the image
  # is broken, and a tag's image is pushed only after it passes.
  image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check the compose example
        run: docker compose -f next/compose.example.yaml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: next
          file: next/Dockerfile
          load: true
          tags: pluxy-ci:test
      - name: Start it and wait for /healthz
        run: |
          set -euo pipefail
          config_dir="$(mktemp -d)"
          # The image runs as user 65532, not the runner's user.
          chmod 0777 "$config_dir"
          client_key="ci-$(openssl rand -hex 16)"
          management_key="ci-$(openssl rand -hex 16)"
          echo "::add-mask::$client_key"
          echo "::add-mask::$management_key"
          # management_allow_remote: a published port reaches core from Docker's address, not loopback.
          printf '{"listen": "0.0.0.0:8400", "client_keys": ["%s"], "management_key": "%s", "management_allow_remote": true}\n' \
            "$client_key" "$management_key" > "$config_dir/config.json"
          chmod 0644 "$config_dir/config.json"
          echo "MANAGEMENT_KEY=$management_key" >> "$GITHUB_ENV"

          # The settings the compose example runs with; a fast health check, so the image's own
          # HEALTHCHECK is seen too.
          docker run -d --name pluxy-ci \
            --publish 127.0.0.1:8400:8400 \
            --volume "$config_dir:/config" \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            --health-start-period 0s --health-interval 2s --health-timeout 3s --health-retries 3 \
            pluxy-ci:test

          healthy=
          for _ in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Running}}' pluxy-ci)" != true ]; then
              break
            fi
            if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8400/healthz || true)" = 200 ]; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ -z "$healthy" ]; then
            echo "::error::/healthz did not answer 200 within 60 seconds"
            docker inspect --format 'container state: {{json .State}}' pluxy-ci
            docker logs pluxy-ci
            exit 1
          fi
          [ "$(curl -fsS http://127.0.0.1:8400/healthz)" = ok ]

          # The image's HEALTHCHECK must pass on its own too.
          status=
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' pluxy-ci)"
            [ "$status" = healthy ] && break
            sleep 1
          done
          if [ "$status" != healthy ]; then
            echo "::error::the image's HEALTHCHECK says $status, not healthy"
            docker inspect --format '{{json .State.Health}}' pluxy-ci
            docker logs pluxy-ci
            exit 1
          fi
      - name: Check what the image holds
        run: |
          set -euo pipefail
          # The panel is built into core.
          panel="$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' http://127.0.0.1:8400/panel/)"
          if [ "$panel" != "200 text/html; charset=utf-8" ]; then
            echo "::error::GET /panel/ answered '$panel'"
            exit 1
          fi
          # The first start installed and enabled every bundled extension.
          expected="$(ls next/extensions/*/pluxy-extension.json | wc -l)"
          packages="$(curl -fsS -H "Authorization: Bearer $MANAGEMENT_KEY" http://127.0.0.1:8400/v0/management/packages)"
          echo "$packages" | jq -c '.packages[] | {id, version, enabled, state}'
          echo "$packages" | jq -e --argjson n "$expected" \
            '(.packages | length) == $n and all(.packages[]; .enabled and .state != "failed")' > /dev/null
          # Upstream HTTPS needs the CA certificates.
          docker run --rm --entrypoint test pluxy-ci:test -s /etc/ssl/certs/ca-certificates.crt
          # The user is not root.
          [ "$(docker inspect --format '{{.Config.User}}' pluxy-ci:test)" = 65532:65532 ]
      - name: Report the image size
        run: |
          size="$(docker image inspect --format '{{.Size}}' pluxy-ci:test)"
          echo "Image size: $((size / 1024 / 1024)) MiB ($size bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the image for arm64 too
        uses: docker/build-push-action@v7
        with:
          context: next
          file: next/Dockerfile
          platforms: linux/arm64
      - name: Stop it
        if: always()
        run: docker rm --force pluxy-ci || true

  # Packs every extension for every platform, as a tag's release does.
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: next/go.mod
          cache: true
          cache-dependency-path: next/go.mod
      - name: Pack the extensions
        working-directory: next
        run: go run ./cmd/pluxy-pack -out dist -platforms "$PLATFORMS"
      - name: Check the index
        working-directory: next/dist/bundled
        run: |
          set -euo pipefail
          extensions="$(ls ../../extensions/*/pluxy-extension.json | wc -l)"
          platforms="$(echo "$PLATFORMS" | tr ',' '\n' | wc -l)"
          [ "$(ls ./*.tar.gz | wc -l)" -eq $((extensions * platforms)) ]
          jq -e --argjson n "$platforms" \
            '(.packages | length) > 0 and all(.packages[].releases[]; (.artifacts | length) == $n)' index.json > /dev/null
      - name: Keep the archives for the release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bundled
          path: next/dist/bundled
          if-no-files-found: error

  # Only a tag runs the jobs below. Each holds only the permission it needs.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/next-v')
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check the tag
        run: |
          version="${GITHUB_REF_NAME#next-v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$GITHUB_REF_NAME is not next-vX.Y.Z or next-vX.Y.Z-suffix"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: bundled
          path: bundled
      - name: Create the release if there is none, and upload
        run: |
          set -euo pipefail
          # The index is a registry: its archive URLs are relative, so beside the archives in
          # this release it installs from here.
          cp bundled/index.json registry.json
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            flags=(--latest=false)
            if [[ "${GITHUB_REF_NAME#next-v}" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" bundled/*.tar.gz registry.json --clobber

  image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/next-v')
    needs: [pack, image-check]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Work out the image tags
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#next-v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$GITHUB_REF_NAME is not next-vX.Y.Z or next-vX.Y.Z-suffix"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:$version"
          # A pre-release does not move latest.
          if [[ "$version" != *-* ]]; then
            tags="$tags"$'\n'"$image:latest"
          fi
          {
            echo "version=$version"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: next
          file: next/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
