name: Core CI

on:
  # Pull requests and merge-queue groups run this through ci.yml, which runs it only when
  # its paths below are touched.
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - '.github/workflows/core-pr-test-build.yml'

concurrency:
  # A literal name: called from ci.yml, github.workflow is the caller's name, the same for every
  # workflow it calls.
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: 1

defaults:
  run:
    working-directory: core

jobs:
  core:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && vars.PLUXY_LINUX_RUNNER && fromJSON(vars.PLUXY_LINUX_RUNNER) || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: core/go.sum
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -p 4 -count=1 ./...
