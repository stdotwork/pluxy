name: Next app

on:
  # Pull requests and merge-queue groups run this through ci.yml, which runs it only when
  # its paths below are touched.
  workflow_call:
    inputs:
      # ci.yml sets this for a pull request without the full-ci label: the native shards then run
      # in the merge queue only (AGENTS.md, "CI"). A push or a manual run has no inputs: null is not
      # true, so it runs them.
      skip-native:
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'next/**'
      - '.github/workflows/next-app.yml'

concurrency:
  # A literal name: called from ci.yml, github.workflow is the caller's name, the same for every
  # workflow it calls.
  group: next-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: next/app

jobs:
  # The checks other than the native test: type check, lint, unit tests, the window's build, Rust
  # format, clippy and tests, and the app tools.
  checks:
    # Pinned: the package names below are Ubuntu 24.04's. PLUXY_LINUX_CLOUD_RUNNER first, then
    # PLUXY_LINUX_RUNNER (AGENTS.md, "Where jobs run").
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && vars.PLUXY_LINUX_CLOUD_RUNNER && fromJSON(vars.PLUXY_LINUX_CLOUD_RUNNER) || (github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && vars.PLUXY_LINUX_RUNNER && fromJSON(vars.PLUXY_LINUX_RUNNER) || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the runner is Ubuntu 24.04
        working-directory: .
        run: |
          . /etc/os-release
          if [ "$VERSION_ID" != "24.04" ]; then
            echo "::error::the packages and paths here are Ubuntu 24.04's; this runner is $PRETTY_NAME"
            exit 1
          fi
          echo "$PRETTY_NAME"
      # The same packages as the native job below, which says what each is for.
      - name: Install WebKitGTK, the tray library, Xvfb, D-Bus, the portals, a tray watcher, squashfs-tools and xdotool
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth dbus-daemon \
            xdg-desktop-portal xdg-desktop-portal-gtk ayatana-indicator-application squashfs-tools xdotool
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: next/go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: next/go.mod
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
          no-cache: ${{ runner.environment != 'github-hosted' }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            next/app/src-tauri -> target
            next/app-tools -> target
          # The native build's cache (the key the single job before the split used), read only: the
          # native-build job saves it.
          shared-key: app
          save-if: false
      # The app builds the UI kit from next/ui, with its copy of preact.
      - name: UI kit install
        working-directory: next/ui
        run: bun install --frozen-lockfile
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build the window
        run: bun run build
      - name: Rust format
        working-directory: next/app/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: next/app/src-tauri
        run: cargo clippy --locked --all-targets --features native-test,artifact-test-trust -- -D warnings
      # Unit tests, and each connection mode against a real core with fake extensions, with an
      # empty HOME and XDG folders.
      - name: Rust tests
        working-directory: next/app/src-tauri
        run: |
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" GOPATH="$(go env GOPATH)"
          test_env="$(mktemp -d)"
          export HOME="$test_env/home" XDG_CONFIG_HOME="$test_env/config" XDG_DATA_HOME="$test_env/data" XDG_CACHE_HOME="$test_env/cache"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          cargo test --locked
      - name: Artifact signature and test trust controls
        working-directory: next/app/src-tauri
        run: cargo test --locked --features artifact-test-trust --test artifact_trust --test release_config
      # The app tools (native programs the app runs on demand), a cargo workspace of their own.
      - name: App tools format, clippy and tests
        working-directory: next/app-tools
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # What every native shard runs, built once (native/run.ts with PLUXY_APP_NATIVE_BUILD): the test
  # package (the test AppImage and its signed update), the dev app with and without
  # artifact-test-trust, the probe, the fixtures and the app tools. Each shard built all of it
  # itself before, about 7 to 9 minutes of every shard. One archive carries it to the shards: tar
  # keeps the programs executable, which upload-artifact does not.
  native-build:
    if: inputs.skip-native != true
    # The same runner as the shards, which run what it builds, so never PLUXY_LINUX_RUNNER either:
    # GitHub's, or PLUXY_LINUX_CLOUD_RUNNER's (AGENTS.md, "Where jobs run"). Pinned: the package
    # names below are Ubuntu 24.04's.
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && vars.PLUXY_LINUX_CLOUD_RUNNER && fromJSON(vars.PLUXY_LINUX_CLOUD_RUNNER) || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the runner is Ubuntu 24.04
        working-directory: .
        run: |
          . /etc/os-release
          if [ "$VERSION_ID" != "24.04" ]; then
            echo "::error::the packages and paths here are Ubuntu 24.04's; this runner is $PRETTY_NAME"
            exit 1
          fi
          echo "$PRETTY_NAME"
      # The same packages as the checks job: the build's libraries, and the services and tools
      # run.ts checks for before it builds (the native job below says what each is for).
      - name: Install WebKitGTK, the tray library, Xvfb, D-Bus, the portals, a tray watcher, squashfs-tools and xdotool
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth dbus-daemon \
            xdg-desktop-portal xdg-desktop-portal-gtk ayatana-indicator-application squashfs-tools xdotool
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
          no-cache: ${{ runner.environment != 'github-hosted' }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            next/app/src-tauri -> target
            next/app-tools -> target
          # The key the single job before the split used, which the checks job reads. Saved from
          # main only: a cache saved on another ref serves only that ref and evicts main's.
          shared-key: app
          save-if: ${{ runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' }}
      # The app builds the UI kit from next/ui, with its copy of preact.
      - name: UI kit install
        working-directory: next/ui
        run: bun install --frozen-lockfile
      - name: Install
        run: bun install --frozen-lockfile
      # The native job below says what this holds.
      - name: Cache the pinned downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pluxy-app-native
          key: app-native-pinned-${{ hashFiles('next/app/native/appimage.ts', 'next/app/package.ts') }}
      - name: Build for the native test
        timeout-minutes: 30
        env:
          PLUXY_APP_NATIVE_BUILD: ${{ runner.temp }}/native-build
        run: bun run test:native
      - name: Pack the builds
        working-directory: .
        run: |
          tar -C "$RUNNER_TEMP" -I 'zstd -T0' -cf "$RUNNER_TEMP/native-build.tar.zst" native-build
          ls -l "$RUNNER_TEMP/native-build.tar.zst"
          du -sh "$RUNNER_TEMP/native-build"
      - name: Upload the builds
        uses: actions/upload-artifact@v4
        with:
          name: native-build
          path: ${{ runner.temp }}/native-build.tar.zst
          # Already compressed.
          compression-level: 0
          # One day: re-running only a failed shard needs it, so after a day re-run all jobs.
          retention-days: 1
          if-no-files-found: error

  # The real app on Xvfb in each mode (next/app/native/run.ts): extension page webviews cannot
  # call app commands. Each shard runs its own sessions (native/shards.ts, which lists these
  # shards in this order) on what native-build built, building none of it again; only the release
  # gate makes its own release builds, as it does wherever it runs. On main before the split the
  # whole test took 35 minutes. Each shard's sessions take about 8 to 11 minutes (native/shards.ts
  # gives the times), so the step allows about four times that for the sessions still being
  # added.
  native:
    if: inputs.skip-native != true
    needs: native-build
    # Pinned: the package names below are Ubuntu 24.04's, and so are the file paths the native
    # test starts services from (next/app/native/services.ts). On GitHub's runners or
    # PLUXY_LINUX_CLOUD_RUNNER's (Namespace's have /dev/fuse), never PLUXY_LINUX_RUNNER: the
    # document portal needs /dev/fuse, which the maintainers' runner containers don't get (FUSE in a
    # container needs extra privilege).
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && vars.PLUXY_LINUX_CLOUD_RUNNER && fromJSON(vars.PLUXY_LINUX_CLOUD_RUNNER) || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [usage, tools, agents, app, release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the runner is Ubuntu 24.04
        working-directory: .
        run: |
          . /etc/os-release
          if [ "$VERSION_ID" != "24.04" ]; then
            echo "::error::the packages and paths here are Ubuntu 24.04's; this runner is $PRETTY_NAME"
            exit 1
          fi
          echo "$PRETTY_NAME"
      # The native test starts the portals and a tray watcher in each run's private session and
      # checks them for real: xdg-desktop-portal ships the portal frontend, the document portal
      # and the permission store; xdg-desktop-portal-gtk is the backend; ayatana-indicator-application's
      # service owns org.kde.StatusNotifierWatcher. squashfs-tools builds the smoke AppImage.
      # xdotool sends real input through the X server (XTEST), for native dialog checks.
      # ImageMagick's import takes the screenshots each session keeps (native/shots.ts).
      - name: Install WebKitGTK, the tray library, Xvfb, D-Bus, the portals, a tray watcher, squashfs-tools, xdotool and ImageMagick
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth dbus-daemon \
            xdg-desktop-portal xdg-desktop-portal-gtk ayatana-indicator-application squashfs-tools xdotool imagemagick
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: next/go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: next/go.mod
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
          no-cache: ${{ runner.environment != 'github-hosted' }}
      # Only the release gate builds here (the release app, and its validator).
      - name: Set up Rust
        if: matrix.shard == 'release'
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Cache Rust dependencies and build outputs
        if: matrix.shard == 'release'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: next/app/src-tauri -> target
          # A cache of its own: native-build saves the debug builds' under app. Saved from main
          # only, like that one.
          shared-key: app-release
          save-if: ${{ runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' }}
      # The app builds the UI kit from next/ui, with its copy of preact.
      - name: UI kit install
        working-directory: next/ui
        run: bun install --frozen-lockfile
      - name: Install
        run: bun install --frozen-lockfile
      # The pinned downloads the test needs (the AppImage runtime and the bundler's tools, pinned
      # in native/appimage.ts and package.ts), so a shard fetches them from GitHub's releases only
      # when no run has kept them. The test checks every file against its SHA-256 whenever it uses
      # one, so what the cache holds is never trusted. Within a job, the test package and the
      # sessions already share this folder, since the job does not move XDG_CACHE_HOME.
      - name: Cache the pinned downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pluxy-app-native
          key: app-native-pinned-${{ hashFiles('next/app/native/appimage.ts', 'next/app/package.ts') }}
      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          name: native-build
          path: ${{ runner.temp }}
      - name: Unpack the builds
        working-directory: .
        run: |
          tar -C "$RUNNER_TEMP" -I zstd -xf "$RUNNER_TEMP/native-build.tar.zst"
          rm "$RUNNER_TEMP/native-build.tar.zst"
      - name: Native test
        timeout-minutes: 45
        env:
          PLUXY_APP_NATIVE_SHARD: ${{ matrix.shard }}
          PLUXY_APP_NATIVE_SHARD_INDEX: ${{ strategy.job-index }}
          PLUXY_APP_NATIVE_SHARD_TOTAL: ${{ strategy.job-total }}
          PLUXY_APP_TEST_SHOTS: ${{ runner.temp }}/native-shots
          PLUXY_APP_NATIVE_PREBUILT: ${{ runner.temp }}/native-build
        run: bun run test:native
      # Each session's last screen, for a PR to link as proof of what the app showed. Kept 7 days.
      - name: Upload the native test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-screenshots-${{ matrix.shard }}
          path: ${{ runner.temp }}/native-shots
          retention-days: 7
          if-no-files-found: ignore

  # The workflow's one result, under the name of the single job before the split: it fails when
  # the checks, the native build or any native shard did not pass. The build and the shards may be
  # skipped only when ci.yml said so (skip-native).
  app:
    if: ${{ !cancelled() }}
    needs: [checks, native-build, native]
    # Like checks: PLUXY_LINUX_CLOUD_RUNNER first, then PLUXY_LINUX_RUNNER.
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && vars.PLUXY_LINUX_CLOUD_RUNNER && fromJSON(vars.PLUXY_LINUX_CLOUD_RUNNER) || (github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && vars.PLUXY_LINUX_RUNNER && fromJSON(vars.PLUXY_LINUX_RUNNER) || 'ubuntu-24.04' }}
    steps:
      - name: Every job passed
        working-directory: .
        env:
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.native-build.result }}
          NATIVE: ${{ needs.native.result }}
          SKIP_NATIVE: ${{ inputs.skip-native == true }}
        run: |
          echo "checks: $CHECKS; native build: $BUILD; native shards: $NATIVE (skip-native: $SKIP_NATIVE)"
          [ "$CHECKS" = success ] && { { [ "$BUILD" = success ] && [ "$NATIVE" = success ]; } ||
            { [ "$SKIP_NATIVE" = true ] && [ "$BUILD" = skipped ] && [ "$NATIVE" = skipped ]; }; }
