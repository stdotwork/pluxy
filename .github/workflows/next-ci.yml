name: Next CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'next/**'
      - '.github/workflows/next-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'next/**'
      - '.github/workflows/next-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: 1

defaults:
  run:
    working-directory: next

jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: next/go.mod
          cache: true
          cache-dependency-path: next/go.mod
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: UI install
        working-directory: next/ui
        run: bun install --frozen-lockfile
      - name: UI type check
        working-directory: next/ui
        run: bun run check
      - name: UI lint
        working-directory: next/ui
        run: bun run lint
      - name: UI unit tests
        working-directory: next/ui
        run: bun run test
      - name: Build the panel core embeds
        run: go generate ./internal/panel
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          PLUXY_REQUIRE_PANEL: '1'
        run: go test -race -count=1 ./...
      - name: Install Chromium for the browser test
        working-directory: next/ui
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Browser test
        working-directory: next/ui
        run: bun run test:browser
