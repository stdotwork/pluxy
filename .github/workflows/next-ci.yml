name: Next CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'next/**'
      - '.github/workflows/next-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'next/**'
      - '.github/workflows/next-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: 1

defaults:
  run:
    working-directory: next

jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The checkout is mounted read-write into the Playwright container, and no step needs
          # git credentials, so the job token is not stored in .git/config.
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: next/go.mod
          cache: true
          cache-dependency-path: next/go.mod
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: UI install
        working-directory: next/ui
        run: bun install --frozen-lockfile
      - name: UI type check
        working-directory: next/ui
        run: bun run check
      - name: UI lint
        working-directory: next/ui
        run: bun run lint
      - name: UI unit tests
        working-directory: next/ui
        run: bun run test
      - name: Build the panel core embeds
        run: go generate ./internal/panel
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          PLUXY_REQUIRE_PANEL: '1'
        run: go test -race -count=1 ./...
      # Firefox and WebKit need about 185 system packages the runner image lacks, and installing
      # them with apt fails whenever the Ubuntu archives are unreachable. Microsoft's Playwright
      # image for the installed Playwright version already has all three browsers and their
      # libraries, so the browser tests run in it, with this job's checkout, Go, Bun and Go module
      # cache mounted at the same paths.
      - name: Pull the Playwright image for the browser tests
        working-directory: next/ui
        timeout-minutes: 10
        run: |
          version="$(jq -r .version node_modules/@playwright/test/package.json)"
          image="mcr.microsoft.com/playwright:v${version}-resolute"
          docker pull "$image"
          echo "PLAYWRIGHT_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Browser tests
        working-directory: next/ui
        timeout-minutes: 15
        run: |
          goroot="$(go env GOROOT)"
          gomodcache="$(go env GOMODCACHE)"
          bun="$(readlink -f "$(command -v bun)")"
          bun_dir="$(dirname "$bun")"
          # setup-go saves this job's Go caches for later jobs, release builds among them, so the
          # container reads the module cache without writing to it and builds in its own GOCACHE.
          # Unlike the Test step, cgo is off here: the image has no C compiler, and next/ has no cgo code.
          # playwright test runs on the image's own Node (26 in 1.65.0), not on the Node 24 this job sets up.
          # .git is mounted read-only over the checkout: the checkout's post-step runs git there with
          # the job token in its environment, so the image must not be able to change git's config.
          docker run --rm --init --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e CI -e HOME=/tmp -e CGO_ENABLED=0 \
            -e PATH="$goroot/bin:$bun_dir:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            -e GOMODCACHE="$gomodcache" -e GOCACHE=/tmp/go-build \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$GITHUB_WORKSPACE/.git:$GITHUB_WORKSPACE/.git:ro" \
            -v "$goroot:$goroot:ro" -v "$bun_dir:$bun_dir:ro" \
            -v "$gomodcache:$gomodcache:ro" \
            -w "$PWD" \
            "$PLAYWRIGHT_IMAGE" bun run test:browser
