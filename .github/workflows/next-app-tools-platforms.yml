name: Next app tools platforms

# Builds, lints and unit-tests the app tools (next/app-tools, the native programs the desktop app
# runs on demand) on Windows and macOS. Linux runs them in next-app.yml. The claude-desktop,
# opencode, omp-setup, grok-setup, hermes-setup and pi-setup writer tools are not ported yet and
# are left out here. The wsl job runs pluxy/wsl and the Linux side of a WSL instance against real
# WSL distributions.

on:
  # Pull requests and merge-queue groups run this through ci.yml, which runs it only when
  # its paths below are touched.
  workflow_call:
  workflow_dispatch:
  # Not on every push to main: the merge queue already ran this on the exact tree it merges, and
  # the hosted macOS pool is short enough that re-runs on main starved the queue's own jobs. One
  # run a day on main keeps main's caches fresh for the PR and merge-queue runs that restore them.
  schedule:
    - cron: '47 3 * * *'

concurrency:
  # A literal name: called from ci.yml, github.workflow is the caller's name, the same for every
  # workflow it calls.
  group: next-app-tools-platforms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: next/app-tools

env:
  # The writer tools not ported to Windows and macOS yet, Linux only for now.
  NOT_PORTED: --exclude claude-desktop --exclude opencode --exclude omp-setup --exclude grok-setup --exclude hermes-setup --exclude pi-setup

jobs:
  tools:
    name: app tools (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'windows-latest' && (github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && vars.PLUXY_WINDOWS_RUNNER && fromJSON(vars.PLUXY_WINDOWS_RUNNER) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: next/app-tools -> target
          key: ${{ matrix.os }}
          save-if: ${{ runner.environment == 'github-hosted' }}
      - name: Clippy
        run: cargo clippy --locked --workspace $NOT_PORTED --all-targets -- -D warnings
      # Unit tests with an empty temporary home, so no test can reach the runner's own.
      - name: Tests
        run: |
          export RUSTUP_HOME="${RUSTUP_HOME:-$(cygpath -u "${USERPROFILE:-$HOME}" 2>/dev/null || echo "$HOME")/.rustup}"
          export CARGO_HOME="${CARGO_HOME:-$(cygpath -u "${USERPROFILE:-$HOME}" 2>/dev/null || echo "$HOME")/.cargo}"
          test_env="$(mktemp -d)"
          export HOME="$test_env/home"
          mkdir -p "$HOME"
          if [ "$RUNNER_OS" = Windows ]; then
            export USERPROFILE="$(cygpath -w "$HOME")"
            export APPDATA="$(cygpath -w "$test_env/appdata")" LOCALAPPDATA="$(cygpath -w "$test_env/localappdata")"
            mkdir -p "$test_env/appdata" "$test_env/localappdata"
          fi
          status=0
          # --show-output prints what passing tests said, so a test's own skip line is seen.
          cargo test --locked --no-fail-fast --workspace $NOT_PORTED -- --show-output 2>&1 | tee "$RUNNER_TEMP/cargo-test.log" || status=$?
          # Record the counts, with the tests that skipped a part this account may not do (such as
          # making a symbolic link), and refuse a run that ran nothing.
          awk '/^test result:/ { p += $4; f += $6; i += $8 } /^skipped: / { s++ } END {
            printf "passed %d, failed %d, ignored %d, skipped parts %d\n", p, f, i, s
            if (p == 0) exit 1
          }' "$RUNNER_TEMP/cargo-test.log" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # pluxy/wsl (next/app-tools/wsl) and the Linux side of a WSL instance (pluxy-program's
  # environment check, pluxy-transactions in a distribution) against Windows' own wsl.exe and real
  # distributions, under WSL 2 and WSL 1. Always a GitHub-hosted runner, discarded after the job: it
  # installs distributions and users. Nothing stands in for WSL. Every test the job names must
  # run and pass; a skipped or missing one fails it.
  wsl:
    name: WSL ${{ matrix.wsl }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        wsl: ['2', '1']
    env:
      WSL_UTF8: '1'
      # The Linux programs are built here for Linux (static, musl), linked by Rust's own lld.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      PLUXY_WSL_TEST_DISTRO: Ubuntu
      PLUXY_WSL_TEST_OTHER: Other
      PLUXY_WSL_TEST_VERSION: ${{ matrix.wsl }}
      PLUXY_WSL_TEST_WRITER: /mnt/c/pluxy-wsl/writer/fixture-writer
      PLUXY_WSL_TEST_WRITER_DIR: /mnt/c/pluxy-wsl/writer
      PLUXY_WSL_TEST_DRIVE_DIR: /mnt/c/pluxy-wsl/drive
      # Git Bash rewrites values that look like POSIX paths (/mnt/c/...) into Windows paths under
      # its own folder when it starts a Windows program such as cargo; these are Linux paths.
      MSYS2_ENV_CONV_EXCL: PLUXY_WSL_TEST_
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-unknown-linux-musl
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: next/app-tools -> target
          key: wsl
      - name: Build the Windows tests and the Linux programs
        run: |
          cargo test --locked -p wsl --test real_wsl --no-run
          mkdir -p /c/pluxy-wsl/linux /c/pluxy-wsl/writer /c/pluxy-wsl/drive
          # The unit tests of pluxy-program and pluxy-transactions, built for Linux.
          cargo test --locked --no-run --target x86_64-unknown-linux-musl -p pluxy-program -p pluxy-transactions --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | "\(.target.name) \(.executable)"' \
            | while read -r name exe; do cp "$(cygpath -u "$exe")" "/c/pluxy-wsl/linux/$name"; done
          ls -l /c/pluxy-wsl/linux
          test -f /c/pluxy-wsl/linux/pluxy_program && test -f /c/pluxy-wsl/linux/pluxy_transactions
          # The fixture writer's Linux program, in a package folder of its own.
          cargo build --locked --target x86_64-unknown-linux-musl -p pluxy-transactions --example fixture-writer
          cp target/x86_64-unknown-linux-musl/debug/examples/fixture-writer lib/transactions/examples/fixture-writer/pluxy-extension.json /c/pluxy-wsl/writer/
          printf '{"theme": "light"}\n' > /c/pluxy-wsl/drive/settings.json
      - name: Windows test before any distribution is installed
        run: |
          # What wsl.exe itself answers, for the record: exit code, then the bytes.
          code=0; /c/Windows/System32/wsl.exe --list --quiet > "$RUNNER_TEMP/list.out" 2> "$RUNNER_TEMP/list.err" || code=$?
          echo "wsl.exe --list --quiet: exit $code"; od -c "$RUNNER_TEMP/list.out" | head -20; od -c "$RUNNER_TEMP/list.err" | head -20
          cargo test --locked -p wsl --test real_wsl -- --ignored --exact distros_before_any_distribution_is_installed_says_not_installed 2>&1 | tee "$RUNNER_TEMP/no-distro.log"
          grep -q '^test result: ok. 1 passed' "$RUNNER_TEMP/no-distro.log"
      - name: Set up the distributions
        shell: pwsh
        timeout-minutes: 40
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          # Runs wsl.exe; a launch WSL 1 refuses with 0xd0000225 (nothing ran) is tried again.
          $helper = @'
          $WSL = "$env:SystemRoot\System32\wsl.exe"
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          function W([string[]]$a) {
            $ErrorActionPreference = 'Continue'
            for ($k = 1; $k -le 5; $k++) {
              $out = (& $WSL @a 2>&1 | Out-String)
              $code = $LASTEXITCODE
              if ($code -eq -1 -and $out -match '0xd0000225' -and $k -lt 5) {
                Write-Host "retry: WSL refused a launch with 0xd0000225 ($k): $a"
                Start-Sleep -Seconds 2
                continue
              }
              $script:WOut = $out
              Write-Host $out
              return $code
            }
          }
          function Must([string[]]$a) { $c = W $a; if ($c -ne 0) { throw "wsl.exe $a exited $c" } }
          '@
          Set-Content -Path "$env:RUNNER_TEMP\wsl.ps1" -Value $helper
          . "$env:RUNNER_TEMP\wsl.ps1"
          Must @('--version')
          # The install has been seen to stall: given 15 minutes, then removed and tried once more.
          $installed = $false
          for ($i = 1; $i -le 2 -and -not $installed; $i++) {
            $p = Start-Process -FilePath $WSL -ArgumentList '--install', '-d', 'Ubuntu', '--no-launch' -NoNewWindow -PassThru
            $null = $p.Handle
            if ($p.WaitForExit(900000)) {
              $installed = ($p.ExitCode -eq 0)
              if (-not $installed) { Write-Host "install exited $($p.ExitCode) (attempt $i)" }
            } else {
              Write-Host "install stalled for 15 minutes (attempt $i)"
              $p.Kill($true)
            }
            if (-not $installed) { W @('--unregister', 'Ubuntu') | Out-Null }
          }
          if (-not $installed) { throw 'WSL could not install Ubuntu' }
          if ($env:PLUXY_WSL_TEST_VERSION -eq '1') { Must @('--set-version', 'Ubuntu', '1') }
          $setup = @'
          set -e
          useradd -m -s /bin/bash alice
          useradd -m -s /bin/bash bob
          printf '[user]\ndefault=alice\n' > /etc/wsl.conf
          install -d -o bob -g bob /home/bob/.local /home/bob/.local/bin /home/bob/.claude
          printf '#!/bin/sh\necho nonlogin\n' > /home/bob/.local/bin/pluxy-nonlogin
          chmod 755 /home/bob/.local/bin/pluxy-nonlogin
          printf 'export PATH="$HOME/.local/bin:$PATH"\n' >> /home/bob/.bashrc
          printf '{"theme": "light"}\n' > /home/bob/.claude/settings.json
          chown bob:bob /home/bob/.local/bin/pluxy-nonlogin /home/bob/.claude/settings.json
          cat > /usr/local/bin/pluxy-standin <<'EOS'
          #!/bin/sh
          { id -un; pwd; for a in "$@"; do printf '%s\n' "$a"; done; } > /tmp/pluxy-standin.out
          EOS
          chmod 755 /usr/local/bin/pluxy-standin
          echo SETUP-OK
          '@
          [IO.File]::WriteAllText('C:\pluxy-wsl\setup.sh', $setup.Replace("`r`n", "`n"))
          Must @('-d', 'Ubuntu', '-u', 'root', '--exec', '/bin/sh', '/mnt/c/pluxy-wsl/setup.sh')
          Must @('--terminate', 'Ubuntu')
          # A second distribution, a copy of the first, for the wrong-distribution cases.
          Must @('--export', 'Ubuntu', 'C:\pluxy-wsl\ubuntu.tar')
          Must @('--import', 'Other', 'C:\pluxy-wsl\other', 'C:\pluxy-wsl\ubuntu.tar', '--version', $env:PLUXY_WSL_TEST_VERSION)
          Remove-Item 'C:\pluxy-wsl\ubuntu.tar'
          Must @('-d', 'Ubuntu', '--exec', '/bin/sh', '-c', 'id -un; command -v pluxy-standin')
          if ($script:WOut -notmatch 'alice') { throw "the default user is not alice: $script:WOut" }
          Must @('--list', '--verbose')
          "WSL: $((& $WSL --version | Out-String).Trim() -replace '\s+', ' ')" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Linux tests inside the distribution, as a user that is not its default
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:RUNNER_TEMP\wsl.ps1"
          $env:PLUXY_WSL_TEST_EXPECT = 'Ubuntu:bob'
          $env:PLUXY_ENVIRONMENT = 'wsl:Ubuntu:bob'
          $env:WSLENV = 'PLUXY_WSL_TEST_EXPECT/u:PLUXY_WSL_TEST_OTHER/u:PLUXY_ENVIRONMENT/u:PLUXY_WSL_TEST_DRIVE_DIR/u'
          $failed = $false
          # Each suite whole, then its real-WSL tests by name: the counts must be the expected ones.
          foreach ($run in @(
              @{ bin = 'pluxy_program'; filter = 'wsl_real'; real = 1 },
              @{ bin = 'pluxy_transactions'; filter = 'wsl_real'; real = 2 })) {
            $exe = "/mnt/c/pluxy-wsl/linux/$($run.bin)"
            $code = W @('-d', 'Ubuntu', '-u', 'bob', '--cd', '/home/bob', '--exec', $exe, '--test-threads=1')
            if ($code -ne 0) { $failed = $true; Write-Host "::error::$($run.bin) failed in WSL $env:PLUXY_WSL_TEST_VERSION" }
            "$($run.bin), whole suite in WSL $($env:PLUXY_WSL_TEST_VERSION): $((($script:WOut -split "`n") | Select-String '^test result:') -join ' ')" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            $code = W @('-d', 'Ubuntu', '-u', 'bob', '--cd', '/home/bob', '--exec', $exe, '--ignored', $run.filter, '--test-threads=1')
            $m = [regex]::Match($script:WOut, 'test result: \w+\. (\d+) passed; (\d+) failed; (\d+) ignored')
            $passed, $fails, $ignored = if ($m.Success) { (1..3 | ForEach-Object { [int]$m.Groups[$_].Value }) } else { 0, 0, 0 }
            $counts = "passed $passed of $($run.real), failed $fails, ignored $ignored$(if (-not $m.Success) { ' (no test result line)' })"
            "$($run.bin), real-WSL tests: $counts" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            if ($code -ne 0 -or -not $m.Success -or $passed -ne $run.real -or $fails -ne 0 -or $ignored -ne 0) { $failed = $true; Write-Host "::error::$($run.bin) real-WSL tests: exit $code, $counts" }
          }
          if ($failed) { exit 1 }
      - name: Windows tests against the distributions
        run: |
          # What a Windows program sees of a Linux path variable, as set and without the exclusion.
          cmd //c "echo PLUXY_WSL_TEST_WRITER_DIR=%PLUXY_WSL_TEST_WRITER_DIR%"
          env -u MSYS2_ENV_CONV_EXCL cmd //c "echo without MSYS2_ENV_CONV_EXCL: PLUXY_WSL_TEST_WRITER_DIR=%PLUXY_WSL_TEST_WRITER_DIR%"
          status=0
          cargo test --locked -p wsl --test real_wsl -- --ignored --skip distros_before_any_distribution_is_installed --test-threads=1 2>&1 | tee "$RUNNER_TEMP/real-wsl.log" || status=$?
          # Five tests, each run and passed: none may be skipped or missing.
          awk '/^test result:/ { p += $4; f += $6; i += $8 } END {
            printf "pluxy/wsl real-WSL tests: passed %d, failed %d, ignored %d\n", p, f, i
            if (p != 5 || f != 0 || i != 0) exit 1
          }' "$RUNNER_TEMP/real-wsl.log" | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"
