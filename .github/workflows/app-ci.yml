name: App CI
# Checks the Tauri desktop app in extensions/app/, in two jobs. Frontend (Bun 1.3.14): `bun install
# --frozen-lockfile`, `bun run check`, `bun test` and `bun run build`. Rust (1.97.0, with the Tauri
# Linux packages installed): `cargo check --locked` and `cargo test --locked` in src-tauri, the
# tests run with an empty temporary HOME and XDG folders.
#
# Pull requests and merge-queue groups run it through ci.yml, when a changed path is under
# extensions/app/ or is this file. It also runs on pushes to `main` that touch those paths, and by
# hand.
#
# Both jobs run on ubuntu-latest, or on the maintainers' runner when the repository variable
# PLUXY_LINUX_RUNNER is set (AGENTS.md, "Where jobs run"). It uploads nothing.

on:
  # Pull requests and merge-queue groups run this through ci.yml, which runs it only when
  # its paths below are touched.
  workflow_call:
  push:
    branches:
      - main
    paths:
      - 'extensions/app/**'
      - '.github/workflows/app-ci.yml'
  workflow_dispatch:

concurrency:
  # A literal name: called from ci.yml, github.workflow is the caller's name, the same for every
  # workflow it calls.
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: extensions/app

jobs:
  frontend:
    name: Frontend
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && vars.PLUXY_LINUX_RUNNER && fromJSON(vars.PLUXY_LINUX_RUNNER) || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
          no-cache: ${{ runner.environment != 'github-hosted' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Run Bun unit tests
        run: bun test

      - name: Build frontend
        run: bun run build

  rust:
    name: Rust
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && vars.PLUXY_LINUX_RUNNER && fromJSON(vars.PLUXY_LINUX_RUNNER) || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: extensions/app/src-tauri -> target
          # Saved from main only: a cache saved on a PR or merge-group ref is usable only there, and
          # those filled the repo's 10 GB and evicted main's, which every run restores.
          save-if: ${{ runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' }}

      - name: Check Rust
        run: cargo check --locked
        working-directory: extensions/app/src-tauri

      # The app manages agent config folders under HOME, so tests get an empty temporary HOME
      # and XDG folders, each its own sibling folder. CARGO_HOME and RUSTUP_HOME keep pointing
      # at the installed toolchain.
      - name: Test Rust
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          test_env="$RUNNER_TEMP/app-test-env"
          mkdir -p "$test_env/home" "$test_env/config" "$test_env/data" "$test_env/cache" "$test_env/state" "$test_env/runtime"
          chmod 700 "$test_env/runtime"
          export HOME="$test_env/home"
          export XDG_CONFIG_HOME="$test_env/config"
          export XDG_DATA_HOME="$test_env/data"
          export XDG_CACHE_HOME="$test_env/cache"
          export XDG_STATE_HOME="$test_env/state"
          export XDG_RUNTIME_DIR="$test_env/runtime"
          cargo test --locked
        working-directory: extensions/app/src-tauri
