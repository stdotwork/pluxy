name: App CI

on:
  pull_request:
    paths:
      - 'extensions/app/**'
      - '.github/workflows/app-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'extensions/app/**'
      - '.github/workflows/app-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: extensions/app

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Run Bun unit tests
        run: bun test

      - name: Build frontend
        run: bun run build

  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: extensions/app/src-tauri -> target

      - name: Check Rust
        run: cargo check --locked
        working-directory: extensions/app/src-tauri

      # The app manages agent config folders under HOME, so tests get an empty temporary HOME
      # and XDG folders, each its own sibling folder. CARGO_HOME and RUSTUP_HOME keep pointing
      # at the installed toolchain.
      - name: Test Rust
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          test_env="$RUNNER_TEMP/app-test-env"
          mkdir -p "$test_env/home" "$test_env/config" "$test_env/data" "$test_env/cache" "$test_env/state" "$test_env/runtime"
          chmod 700 "$test_env/runtime"
          export HOME="$test_env/home"
          export XDG_CONFIG_HOME="$test_env/config"
          export XDG_DATA_HOME="$test_env/data"
          export XDG_CACHE_HOME="$test_env/cache"
          export XDG_STATE_HOME="$test_env/state"
          export XDG_RUNTIME_DIR="$test_env/runtime"
          cargo test --locked
        working-directory: extensions/app/src-tauri
